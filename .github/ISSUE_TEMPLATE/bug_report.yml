name: Bug Report
description: Create a report to help us improve dotnet-web-foundation
title: "fix: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please search existing issues before submitting to ensure it has not already been reported.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Start application with database provider 'SqlServer'
        2. Navigate to '/Account/Login'
        3. Attempt to...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database Provider
      options:
        - "SQL Server"
        - "MySQL / MariaDB"
        - "Both / Database Agnostic"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS version, .NET SDK version, Docker version.
      placeholder: ".NET 10.0.100, Ubuntu 24.04 / Windows 11"
    validations:
      required: false
