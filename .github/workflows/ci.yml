name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Verify code formatting
        run: dotnet format --verify-no-changes --verbosity normal

      - name: Build solution (Release)
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Run unit tests
        run: dotnet test tests/Foundation.UnitTests/Foundation.UnitTests.csproj --no-build -c Release --logger "trx;LogFileName=unit_tests.trx"

      - name: Run architecture tests
        run: dotnet test tests/Foundation.ArchitectureTests/Foundation.ArchitectureTests.csproj --no-build -c Release --logger "trx;LogFileName=arch_tests.trx"

      - name: Check for vulnerable dependencies
        run: dotnet list package --vulnerable --include-transitive

      - name: Audit dependency licenses
        shell: pwsh
        run: ./scripts/check-licenses.ps1

  container-build:
    name: Container Build & Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build container image (dry-run)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: dotnet-web-foundation:ci-test
