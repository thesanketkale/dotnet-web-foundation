services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=FoundationDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true;
      - ConnectionStrings__MySqlConnection=Server=mysql;Port=3306;Database=FoundationDb;User=root;Password=YourStrong@Passw0rd;
      - Database__Provider=SqlServer
      - Database__ApplyMigrationsAtStartup=true
      - Email__Host=mailpit
      - Email__Port=1025
    depends_on:
      - sqlserver
      - mailpit
    profiles:
      - app

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: foundation-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    profiles:
      - sqlserver
      - app

  mysql:
    image: mysql:8.4
    container_name: foundation-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=YourStrong@Passw0rd
      - MYSQL_DATABASE=FoundationDb
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    profiles:
      - mysql

  mailpit:
    image: axllent/mailpit:latest
    container_name: foundation-mailpit
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP
    profiles:
      - mailpit
      - app

volumes:
  sqlserver-data:
  mysql-data:
